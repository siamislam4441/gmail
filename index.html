<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Finder</title>

  <style>

    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .box{
      background:#1e293b;
      padding:30px;
      border-radius:15px;
      width:350px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      margin-bottom:15px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#3b82f6;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    #result{
      margin-top:20px;
      background:#0f172a;
      padding:10px;
      border-radius:8px;
      white-space:pre-line;
      min-height:50px;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>Gmail Finder</h2>

    <input
      type="text"
      id="search"
      placeholder="Username বা Password">

    <button onclick="findData()">
      Search
    </button>

    <div id="result"></div>

  </div>

  <script>

    const API_URL =
    "https://script.google.com/macros/s/AKfycbyxI98p7kYGI8WlpbJIigq86V-c90h_C6undQZIzU5xnPYTrqfZfmY6zREThYlQQHLAww/exec";

    async function findData(){

      let value =
      document.getElementById("search").value;

      let resultBox =
      document.getElementById("result");

      resultBox.innerHTML = "Loading...";

      try{

        let response =
        await fetch(
          API_URL +
          "?search=" +
          encodeURIComponent(value)
        );

        let data =
        await response.json();

        if(data.length === 0){

          resultBox.innerHTML =
          "কিছু পাওয়া যায়নি";

          return;
        }

        let output = "";

        data.forEach(item => {

          if(item.type === "password"){
            output +=
            "Password: " +
            item.value + "\\n";
          }

          if(item.type === "username"){
            output +=
            "Username: " +
            item.value + "\\n";
          }

        });

        resultBox.innerText = output;

      }catch(err){

        resultBox.innerHTML =
        "Error";

      }

    }

  </script>

</body>
</html>
